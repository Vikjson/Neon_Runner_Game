<!doctype html>
<html>
<head>
    <title>Neon Runner</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="theme-color" content="#ff00ff">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="description"
          content="Neon Runner - Retro endless runner game">

    <link href="styles.css"
          rel="stylesheet"
          type="text/css">
</head>

<body>

<div align="center" id="embed-html"></div>
<input
        id="mobileInput"
        type="text"
        inputmode="text"
        maxlength="12"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        style="
        position:absolute;
        left:-1000px;
        top:-1000px;
        opacity:0;
    ">

<script type="text/javascript"
        src="html/html.nocache.js"></script>

<script>
    function focusMobileInput() {
        const input = document.getElementById("mobileInput");
        input.focus();
    }

    function getMobileInputText() {
        return document.getElementById("mobileInput").value;
    }


    function handleMouseDown(evt) {
        evt.preventDefault();
        evt.stopPropagation();
        window.focus();
    }

    function handleMouseUp(evt) {
        evt.preventDefault();
        evt.stopPropagation();
    }

    document.addEventListener('contextmenu',
        event => event.preventDefault());

    const gameDiv = document.getElementById('embed-html');

    gameDiv.addEventListener('mousedown',
        handleMouseDown, false);

    gameDiv.addEventListener('mouseup',
        handleMouseUp, false);

    gameDiv.addEventListener('touchstart', () => {
        focusMobileInput();
    }, false);



</script>

</body>
</html>
