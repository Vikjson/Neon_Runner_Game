<body>

<div align="center" id="embed-html"></div>
<script type="text/javascript" src="html/html.nocache.js"></script>


<script>
    function preventDefaultTouch(evt) {
        evt.preventDefault();
        evt.stopPropagation();
        window.focus();
    }

    function handleMouseDown(evt) {
        evt.preventDefault();
        evt.stopPropagation();
        window.focus();
    }

    function handleMouseUp(evt) {
        evt.preventDefault();
        evt.stopPropagation();
    }

    document.addEventListener('contextmenu',
        event => event.preventDefault());

    const gameDiv = document.getElementById('embed-html');

    gameDiv.addEventListener('mousedown',
        handleMouseDown, false);

    gameDiv.addEventListener('mouseup',
        handleMouseUp, false);

    gameDiv.addEventListener('touchstart',
        preventDefaultTouch, false);

    gameDiv.addEventListener('touchmove',
        preventDefaultTouch, false);

    gameDiv.addEventListener('touchend',
        preventDefaultTouch, false);
</script>
</body>
